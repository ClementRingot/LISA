name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - name: Require a changeset when shipped content changed
        if: github.event_name == 'pull_request'
        run: node scripts/require-changeset.mjs "origin/${{ github.base_ref }}"
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Server bundle carries its package version
        # /health and the MCP serverInfo report the version esbuild bakes in
        # (src/server/version.ts); a missed define would leave the placeholder.
        run: |
          v="$(node -p "require('./packages/server/package.json').version")"
          grep -q "\"$v\"" packages/server/dist/index.js
          ! grep -q __LISA_VERSION__ packages/server/dist/index.js
