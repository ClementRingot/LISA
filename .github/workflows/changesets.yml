name: Changesets

# Fully automated release train (changesets/action), on every push to main:
#
#   - Pending changesets?  → opens/updates the "Version Packages" PR, which runs
#     `npm run changeset:version` (bumps + CHANGELOGs + mirrors mta.yaml /
#     root package.json / plugin.version + lockfile + sync check).
#   - No pending changesets? → runs scripts/tag-missing-releases.mjs, which
#     creates + pushes the CANONICAL tags (vX.Y.Z / arc1-extension-vX.Y.Z) for
#     any committed version not yet tagged on origin. The pushed tags then
#     trigger the existing publish pipelines (release-product.yml /
#     publish-extension.yml → npm publish + GitHub release).
#
# So the only human step left is MERGING the Version Packages PR.
#
# ── Auth: GitHub App ─────────────────────────────────────────────────────────
# Events created with the default GITHUB_TOKEN don't trigger other workflows
# (GitHub anti-recursion), so this workflow needs its own identity. That
# identity is a GitHub App (its credentials never expire, unlike a PAT):
#   1. Create an App on your account (Settings → Developer settings → GitHub
#      Apps): permissions Contents:RW + Pull requests:RW, no webhook.
#   2. Install it on this repository.
#   3. Set the repo VARIABLE  RELEASE_APP_ID          (the App's numeric ID)
#      and the repo SECRET    RELEASE_APP_PRIVATE_KEY (a generated .pem key).
# While those are absent, the workflow falls back to GITHUB_TOKEN, which works
# but won't trigger CI on the Version PR nor the publish pipelines on the tags
# — if a tag ever lands that way, dispatch the publish workflow manually on the
# tag ref.

on:
  push:
    branches: [main]

concurrency: changesets-main

permissions:
  contents: write # push the version branch + tags (GITHUB_TOKEN fallback)
  pull-requests: write # open the Version Packages PR (GITHUB_TOKEN fallback)

jobs:
  changesets:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App token
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # App token → default token; only the App token makes the pushed tags
          # and the Version PR trigger the downstream workflows.
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - uses: changesets/action@v2
        with:
          version: npm run changeset:version
          publish: node scripts/tag-missing-releases.mjs
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
