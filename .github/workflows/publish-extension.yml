name: Publish extension

# Publishes @lisa-mcp/arc1-extension to the public npm registry when an extension
# release tag (arc1-extension-vX.Y.Z) is pushed, then cuts the matching GitHub
# release. The version is validated against the tag (scripts/check-release-naming.mjs)
# before publishing, so a mistagged or drifted version can never reach npm.
#
# npm auth: TRUSTED PUBLISHING (OIDC) — no NPM_TOKEN. The package's npmjs
# settings must list this repo + workflow file as a Trusted Publisher
# (@lisa-mcp/arc1-extension → Settings → Trusted Publisher → GitHub Actions:
# ClementRingot/LISA, publish-extension.yml). `id-token: write` lets npm verify
# the workflow's identity; provenance is attested automatically.

on:
  push:
    tags: ['arc1-extension-v*']
  # Manual fallback: dispatch on the TAG ref (pick the tag in the Run-workflow
  # dropdown) — e.g. when a tag was pushed with the default GITHUB_TOKEN, which
  # does not trigger `push` workflows.
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      # No registry-url here: it would write an .npmrc expecting NODE_AUTH_TOKEN,
      # which no longer exists — OIDC needs no token config at all.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Trusted publishing needs npm ≥ 11.5 (Node 22 bundles npm 10).
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Validate tag ↔ version
        run: node scripts/check-release-naming.mjs tag "$GITHUB_REF_NAME"
      - name: Build the bundle
        run: |
          npm run build --workspace packages/core
          npm run build --workspace packages/arc1-extension
      - name: Publish to npm (skipped if the version is already published)
        run: |
          VERSION="${GITHUB_REF_NAME#arc1-extension-v}"
          if npm view "@lisa-mcp/arc1-extension@${VERSION}" version >/dev/null 2>&1; then
            echo "@lisa-mcp/arc1-extension@${VERSION} is already on npm — skipping publish."
          else
            npm publish --workspace packages/arc1-extension
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#arc1-extension-v}"
          # Canonical release title from the single source of truth (release-naming.mjs),
          # so the title always satisfies release-guard.yml.
          TITLE="$(node -e "import('./scripts/lib/release-naming.mjs').then(m => process.stdout.write(m.names('extension', process.argv[1]).title))" "$VERSION")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping."
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$TITLE" \
              --notes "📦 Published to npm as [\`@lisa-mcp/arc1-extension@${VERSION}\`](https://www.npmjs.com/package/@lisa-mcp/arc1-extension/v/${VERSION}).

          \`\`\`bash
          npm install @lisa-mcp/arc1-extension@${VERSION}
          \`\`\`

          See the [extension CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/packages/arc1-extension/CHANGELOG.md) for details."
          fi
