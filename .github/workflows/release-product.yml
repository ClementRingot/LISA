name: Product release

# Publishes @lisa-mcp/server to the public npm registry when a product tag
# (vX.Y.Z) is pushed, then cuts the matching GitHub release. The tag ↔ version
# match is validated first (scripts/check-release-naming.mjs), and the release
# title is derived from the same single source of truth as the tag
# (scripts/lib/release-naming.mjs) so it always satisfies release-guard.yml.
# Requires the NPM_TOKEN repository secret (same one publish-extension.yml uses).
#
# The `v*` glob matches only product tags: extension tags start with `arc1-` and
# are handled by publish-extension.yml.

on:
  push:
    tags: ['v*']
  # Manual fallback: dispatch on the TAG ref (pick the tag in the Run-workflow
  # dropdown) — e.g. when a tag was pushed with the default GITHUB_TOKEN, which
  # does not trigger `push` workflows.
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Validate tag ↔ version
        run: node scripts/check-release-naming.mjs tag "$GITHUB_REF_NAME"
      - name: Build the bundle
        run: |
          npm run build --workspace packages/core
          npm run build --workspace packages/server
      - name: Publish to npm (skipped if the version is already published)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@lisa-mcp/server@${VERSION}" version >/dev/null 2>&1; then
            echo "@lisa-mcp/server@${VERSION} is already on npm — skipping publish."
          else
            npm publish --workspace packages/server
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Canonical release title from the single source of truth (release-naming.mjs),
          # so the title always satisfies release-guard.yml.
          TITLE="$(node -e "import('./scripts/lib/release-naming.mjs').then(m => process.stdout.write(m.names('product', process.argv[1]).title))" "$VERSION")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping."
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$TITLE" \
              --generate-notes \
              --notes "📦 Published to npm as [\`@lisa-mcp/server@${VERSION}\`](https://www.npmjs.com/package/@lisa-mcp/server/v/${VERSION}).

          \`\`\`bash
          npx @lisa-mcp/server            # run locally
          npm install @lisa-mcp/server    # or deploy to BTP from npm (templates/mta)
          \`\`\`

          See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for details."
          fi
