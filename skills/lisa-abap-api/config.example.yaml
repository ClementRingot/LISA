# lisa-api.config.yaml — instance settings for the lisa-abap-api skill (TEMPLATE)
#
# The SKILL.md is deliberately environment-AGNOSTIC: everything specific to YOUR
# systems lives here. Copy this file to `lisa-api.config.yaml` next to the skill
# (or into your project root) and fill it in.
#
#   cp config.example.yaml lisa-api.config.yaml
#
# ⚠️ NEVER put passwords in this file. Reference environment variables instead
# (username_env / password_env) — the file is meant to be committable; the
# secrets are not.

default_system: DEV

systems:
  DEV:
    base_url: https://dev-system.example.com
    service_path: /sap/bc/http/sap/zi18n_service
    # on-premise | private-cloud | btp-abap-env | public-cloud
    # → tells the agent the auth prerequisites and whether sap-client applies
    landscape: on-premise
    sap_client: "100"              # on-premise / private-cloud only — omit on cloud
    auth:
      mode: basic                  # basic (direct calls) | destination (callers running on BTP)
      username_env: LISA_DEV_USER  # env var holding the technical/communication user
      password_env: LISA_DEV_PASSWORD
    default_transport: A4HK900123  # optional — used by writes when the user names none

  # PROD:
  #   base_url: https://my-api-host.s4hana.cloud.sap
  #   service_path: /sap/bc/http/sap/zi18n_service
  #   landscape: public-cloud
